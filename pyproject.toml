[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slicedot"
version = "0.1.0"
description = "Sliced Wasserstein-1 targets for atomic model fitting against density maps, in reciprocal space."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "P. H. Zwart", email = "PHZwart@lbl.gov" }]
keywords = [
    "optimal-transport",
    "sliced-wasserstein",
    "crystallography",
    "cryo-em",
    "docking",
    "structure-factors",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
paper = [
    "matplotlib>=3.7",
]

[dependency-groups]
dev = ["pytest>=7.0"]
paper = [
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/phzwart/slicedot"
Repository = "https://github.com/phzwart/slicedot"
Documentation = "https://github.com/phzwart/slicedot/tree/main/docs"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs/paper/paper.tex",
    "/docs/paper/paper.pdf",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
